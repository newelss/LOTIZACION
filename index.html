<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lotización 2D y 3D</title>

    <!-- CesiumJS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>

        html, body, #cesiumContainer {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;
        }

    </style>

</head>


<body>

    <div id="cesiumContainer"></div>


    <script>

        // ==========================================
        // TOKEN DE CESIUM ION (OBLIGATORIO)
        // ==========================================
        // Sin este token, Cesium NO puede descargar el terreno
        // ni las imágenes base, y por eso solo se ven las estrellas.
        //
        // Consigue tu token GRATIS aquí:
        // https://ion.cesium.com/tokens
        //
        // Luego reemplaza el texto de abajo por tu token real.

        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkVVV0NucFRPU0JGcV8xVHkiLCJqdGkiOiIyOTEwNjRmMC00Y2ZjLTQ0YjYtYTI2Ny0wOTlmYzE1MWNjZTUiLCJpZCI6NDY4NjYyLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODY5MzEzMTJ9.2jaISC94sSIND12Uiwk8v5WublaKOhJt_sv_rDQpB5c';


        // ==========================================
        // CREAR VISOR
        // ==========================================

        const viewer = new Cesium.Viewer(
            'cesiumContainer',
            {

                terrain:
                    Cesium.Terrain.fromWorldTerrain(),

                animation: false,

                timeline: false,

                baseLayerPicker: false,

                // MOSTRAR BOTÓN 2D / 3D
                sceneModePicker: true

            }
        );


        // ==========================================
        // CARGAR TU LOTIZACIÓN (mapa.geojson)
        // ==========================================

        Cesium.GeoJsonDataSource.load('mapa.geojson', {

            stroke: Cesium.Color.YELLOW,
            fill: Cesium.Color.YELLOW.withAlpha(0.3),
            strokeWidth: 3,
            clampToGround: true

        }).then(function (dataSource) {

            viewer.dataSources.add(dataSource);

            // Volar la cámara automáticamente hacia los lotes cargados
            viewer.flyTo(dataSource);

        }).catch(function (error) {

            console.log('Error cargando mapa.geojson:', error);

        });


        // ==========================================
        // UBICACIÓN DE TU LOTIZACIÓN (vista inicial de respaldo)
        // ==========================================
        // Esto se usa como referencia; si el geojson carga bien,
        // el flyTo(dataSource) de arriba tomará el control.

        viewer.camera.flyTo({

            destination:

                Cesium.Cartesian3.fromDegrees(

                    -74.2195,

                    -13.1605,

                    2500

                ),

            orientation: {

                heading:
                    Cesium.Math.toRadians(0),

                pitch:
                    Cesium.Math.toRadians(-45),

                roll: 0

            }

        });

    </script>

</body>

</html>
