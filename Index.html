<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lotización 2D y 3D</title>

    <!-- CesiumJS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>

        html, body, #cesiumContainer {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;
        }

    </style>

</head>


<body>

    <div id="cesiumContainer"></div>


    <script>

        // ==========================================
        // CREAR VISOR
        // ==========================================

        const viewer = new Cesium.Viewer(
            'cesiumContainer',
            {

                terrain:
                    Cesium.Terrain.fromWorldTerrain(),

                animation: false,

                timeline: false,

                baseLayerPicker: false,

                // MOSTRAR BOTÓN 2D / 3D
                sceneModePicker: true

            }
        );


        // ==========================================
        // UBICACIÓN DE TU LOTIZACIÓN
        // ==========================================

        viewer.camera.flyTo({

            destination:

                Cesium.Cartesian3.fromDegrees(

                    -74.2195,

                    -13.1605,

                    2500

                ),

            orientation: {

                heading:
                    Cesium.Math.toRadians(0),

                pitch:
                    Cesium.Math.toRadians(-45),

                roll: 0

            }

        });

    </script>

</body>

</html>
